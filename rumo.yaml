objetivo: 'Conferir as cavas da memória espacial de Foz por testemunhas independentes do cálculo pelo MDS: área e fundo de cada seção das pranchas de corte e cotas da sequência executiva'
criterio_de_pronto:
- "seções das pranchas de corte (009 e 010) lidas em código: área de corte (m²) e cota de fundo por seção, com método e tolerância declarados"
- "as mesmas seções medidas no modelo (terreno do MDS × fundo da cava) pela linha de seção da planta"
- "cotas de fundo e de reaterro da sequência executiva (planta 02) conferidas contra o modelo, com tolerância absoluta"
- "volume por seções médias só onde duas ou mais seções paralelas cortam a mesma cava; o resto fica declarado como não conferível"
- "build real de Foz refeito; relatório em docs/plano com o que bateu e o que diferiu"
