objetivo: 'Rodar o build real de Foz (ETA Vila C) e conferir a memória espacial com dados verdadeiros: paridade
  das gavetas, cavas, conciliação com a EAP codificada e aba EAP no HTML'
criterio_de_pronto:
- dados de Foz baixados do Drive conforme a listagem, com as falhas listadas e o motivo
- build completo roda até o HTML; etapas que falharem ficam registradas com o motivo, sem esconder
- paridade.json, conciliacao_eap.json e resumo.json de Foz lidos e explicados no relatório
- relatório em docs/plano com o que bateu, o que diferiu e o que falta; achados viram pendências, não correções
  sem teste
